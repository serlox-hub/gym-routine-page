name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (web + native, 0 warnings)
        run: npm run lint

      - name: Build (web)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Run unit tests
        run: npm run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Coverage (lógica compartida, con umbral)
        run: npm run test:coverage -w @gym/shared

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: apps/web

      # BD efímera para los e2e, en vez del proyecto remoto. Lo que gana no es "no ensuciar prod":
      # es que las migraciones de ESTA rama se aplican sobre una BD limpia, así que el CI prueba
      # código + esquema juntos. Contra el remoto una migración nueva no se ejecutaba nunca, y el
      # orden obligado acababa siendo "aplica en prod, luego mergea".
      # `supabase start` aplica las migraciones de la rama al crear el contenedor, sobre una BD
      # limpia — de eso depende el check de drift del paso siguiente. El `db reset` con el que
      # empieza `npm run test:e2e` las vuelve a aplicar: redundancia asumida en #55 a cambio de que
      # el comando se comporte igual aquí que en local.
      # Se excluye todo lo que la app no usa (verificado: cero `.channel()`). Quedan 5 contenedores:
      # db, kong, auth, rest y storage. `storage` NO se excluye pese a que el único uso de Storage
      # en el cliente sea `getPublicUrl` (que solo construye una URL): la migración 047 escribe en
      # `storage.buckets`, y el `<img>` de las tarjetas sí hace un GET real contra esa URL pública
      # (en CI `VITE_EXERCISE_GIFS_BASE_URL` va vacía → un 404 por tarjeta, inofensivo).
      - name: Levantar Supabase local (BD efímera para los e2e)
        working-directory: apps/web
        run: |
          npx supabase start -x imgproxy,edge-runtime,logflare,vector,supavisor,studio,mailpit,realtime,postgres-meta
          eval "$(npx supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      # `supabase/schema.sql` es la fuente de verdad declarada para "qué existe HOY" en la BD
      # (CLAUDE.md § Database Schema) y hasta ahora nada comprobaba que lo fuera: el guard A7 solo
      # mira que el archivo esté en el diff, no su contenido. Ya mintió — le faltaba la RPC
      # `duplicate_routine_day` de la 059, que la app llama en producción (ver docs/DECISIONS.md).
      # Aquí sale gratis porque la BD que acaba de levantar el paso anterior ES "las migraciones de
      # esta rama sobre una BD limpia". Dumpea con `npm run db:dump`, el mismo script que usa
      # `npm run db:schema`, para que compare literalmente lo que genera el comando que se le pide
      # ejecutar a la gente — y no una copia de sus flags que pueda divergir en silencio.
      # Va ANTES de los e2e a propósito: su precondición es justo lo que garantiza el paso anterior,
      # y tarda segundos. Contrapartida asumida: si salta, los e2e de esa tanda no llegan a correr.
      - name: Verificar que schema.sql no ha derivado de las migraciones
        working-directory: apps/web
        run: |
          npm run db:dump -- /tmp/schema-ci.sql
          if ! diff -u supabase/schema.sql /tmp/schema-ci.sql; then
            echo "::error::supabase/schema.sql no coincide con el dump de las migraciones. Regeneralo con 'npm run db:schema' desde apps/web y commitealo junto a la migracion. Si el diff de arriba es enorme y sin relacion con tu cambio, comprueba que tu CLI de Supabase es la misma version que fija package-lock.json: es quien elige la imagen que genera el dump."
            exit 1
          fi

      # Credenciales fijas del usuario que crea `apps/web/supabase/seed.sql` en cada reset. No son
      # secretos: esa BD vive y muere dentro del job y usa el JWT secret público de la CLI.
      - name: Run e2e tests
        run: npm run test:e2e -w apps/web
        env:
          E2E_TEST_EMAIL: e2e@local.test
          E2E_TEST_PASSWORD: e2e-local-password

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
